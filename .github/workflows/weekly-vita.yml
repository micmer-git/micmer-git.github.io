name: Hourly Vita sync

# Monday morning: pull whatever landed on Intervals.icu during the week into the
# climb data, then rebuild /vita so the hub reflects it. Also runnable by hand.
on:
  schedule:
    - cron: "17 * * * *"       # offset from the busy top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-vita
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build_vita.py reads git log for the changelog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Needs the repo secret INTERVALS_API_KEY (Intervals.icu ▸ Settings ▸ Developer).
      # Each tracker is independent: one failing must not stop the others, and /vita
      # gets rebuilt either way so the hub always matches whatever is on disk.
      - name: Sync all trackers from Intervals.icu
        continue-on-error: true
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          if [ -z "$INTERVALS_API_KEY" ]; then
            echo "::warning::INTERVALS_API_KEY is not set — skipping every sync."
            exit 0
          fi
          rc=0
          echo "::group::Gazzaniga → Orezzo"
          python tools/sync_intervals.py --config tools/gazzaniga-orezzo.json || rc=1
          echo "::endgroup::"
          echo "::group::Sogni di un Unno"
          python tools/sync_sogni.py || rc=1
          echo "::endgroup::"
          echo "::group::Diario di un Unno"
          python tools/sync_diario.py || rc=1
          echo "::endgroup::"
          # Questi due avevano gia' il loro builder e la loro config in tools/, ma
          # nessuno li chiamava: si rigeneravano solo quando qualcuno ci lavorava
          # sopra a mano, e nel frattempo restavano indietro di settimane. Un
          # tracker che si aggiorna solo se te ne ricordi non e' un tracker.
          echo "::group::Il signore delle cime"
          python tools/build_signore.py || rc=1
          echo "::endgroup::"
          echo "::group::Top 20"
          python tools/build_top20.py || rc=1
          echo "::endgroup::"
          exit $rc

      # Lo stesso pull alimenta /vita e il CSV attività letto dal modello del cibo.
      # La prima fase rinnova cache + attività senza comporre la pagina; dopo il
      # rebuild del cibo, la build offline compone il risultato senza un'altra GET.
      - name: Refresh Vita source data
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python tools/build_vita.py --api-key "$INTERVALS_API_KEY" --sync-source

      # Quello che Michele ha annotato dal diario di /vita sta nel Worker vita-diario
      # (D1), che lo serve subito alla pagina ma non e' un registro: il registro e'
      # food_log.csv. Qui si svuota la casella dentro il CSV, PRIMA di build_food.py,
      # se no le righe di oggi non entrerebbero nei conti fino al giro dopo.
      # Senza il secret lo script esce a zero senza scrivere: la pagina si rigenera
      # comunque, che e' il comportamento giusto quando la casella non e' raggiungibile.
      - name: Travasa le annotazioni del diario in food_log.csv
        continue-on-error: true
        env:
          VITA_DIARY_ADMIN: ${{ secrets.VITA_DIARY_ADMIN }}
        run: python tools/apply_diary_ops.py

      # Il cibo prima di /vita: build_vita.py inlina i CSV che questo produce.
      # La sorgente (alimenti, ricette, diario, piatti del mese) sta in tools/food/,
      # dentro questo repo — prima viveva in una repo non pubblicabile e i CSV in
      # vita/ erano copie committate a mano, cioe' due superfici destinate a
      # divergere senza che nessuno se ne accorgesse.
      - name: Rebuild i dati dell'alimentazione
        run: python tools/build_food.py

      # /vita is rebuilt from scratch each week rather than appended to: it holds no
      # state of its own, every number in it comes from the pull.
      - name: Rebuild /vita
        run: python tools/build_vita.py --offline

      # Cheap, no network, and the only thing standing between a broken chart and a
      # week of it being live: the page ships as one flat file, so nothing else
      # would notice.
      - name: Smoke-test /vita
        run: node tools/check_vita.cjs

      - name: Commit if anything moved
        run: |
          git config user.name  "vita-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gazzaniga-orezzo sogni-di-un-unno diario-di-un-unno vita \
                     signoredellecime top-20 tools/signore.json tools/top-20.json \
                     tools/vita_tests.md tools/food/data
          if git diff --cached --quiet; then
            echo "nothing changed this hour"
          else
            git commit -m "hourly: sync intervals.icu + rebuild /vita"
            git push
          fi
