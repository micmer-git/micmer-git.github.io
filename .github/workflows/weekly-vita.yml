name: Weekly tracker sync

# Monday morning: pull whatever landed on Intervals.icu during the week into the
# climb data, then rebuild /vita so the hub reflects it. Also runnable by hand.
on:
  schedule:
    - cron: "0 5 * * 1"        # 05:00 UTC Monday = 07:00 Europe/Rome in summer
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-vita
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build_vita.py reads git log for the changelog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Needs the repo secret INTERVALS_API_KEY (Intervals.icu ▸ Settings ▸ Developer).
      # Each tracker is independent: one failing must not stop the others, and /vita
      # gets rebuilt either way so the hub always matches whatever is on disk.
      - name: Sync all trackers from Intervals.icu
        continue-on-error: true
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          if [ -z "$INTERVALS_API_KEY" ]; then
            echo "::warning::INTERVALS_API_KEY is not set — skipping every sync."
            exit 0
          fi
          rc=0
          echo "::group::Gazzaniga → Orezzo"
          python tools/sync_intervals.py --config tools/gazzaniga-orezzo.json || rc=1
          echo "::endgroup::"
          echo "::group::Sogni di un Unno"
          python tools/sync_sogni.py || rc=1
          echo "::endgroup::"
          echo "::group::Diario di un Unno"
          python tools/sync_diario.py || rc=1
          echo "::endgroup::"
          # The dashboard is rebuilt from scratch each week rather than appended to:
          # it holds no state of its own, every number in it comes from the pull.
          echo "::group::Cruscotto"
          python tools/build_cruscotto.py || rc=1
          echo "::endgroup::"
          exit $rc

      - name: Rebuild /vita
        run: python tools/build_vita.py

      # Cheap, no network, and it is the only thing standing between a broken chart
      # and a week of it being live: the page ships as one flat file, so nothing
      # else would notice.
      - name: Smoke-test /vita/cruscotto
        run: node tools/check_cruscotto.cjs

      - name: Commit if anything moved
        run: |
          git config user.name  "vita-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gazzaniga-orezzo sogni-di-un-unno diario-di-un-unno vita tools/cruscotto_tests.md
          if git diff --cached --quiet; then
            echo "nothing changed this week"
          else
            git commit -m "weekly: sync intervals.icu + rebuild /vita"
            git push
          fi
